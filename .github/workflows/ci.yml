name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc-release,   os: ubuntu-24.04, cc: gcc,   cxx: g++,     cfg: "-DCMAKE_BUILD_TYPE=Release" }
          - { name: linux-clang-release, os: ubuntu-24.04, cc: clang, cxx: clang++, cfg: "-DCMAKE_BUILD_TYPE=Release -DDPD_WERROR=ON" }
          - { name: linux-scalar,        os: ubuntu-24.04, cc: gcc,   cxx: g++,     cfg: "-DCMAKE_BUILD_TYPE=Release -DDPD_ENABLE_SIMD=OFF" }
          - { name: linux-asan-ubsan,    os: ubuntu-24.04, cc: clang, cxx: clang++, cfg: "-DCMAKE_BUILD_TYPE=Debug -DDPD_SANITIZE=address,undefined -DDPD_BUILD_BENCH=OFF" }
          - { name: macos-arm64,         os: macos-14,     cc: clang, cxx: clang++, cfg: "-DCMAKE_BUILD_TYPE=Release" }
          - { name: windows-msvc,        os: windows-2022, cc: cl,    cxx: cl,      cfg: "-DCMAKE_BUILD_TYPE=Release" }
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      ASAN_OPTIONS: detect_leaks=1
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} ${{ matrix.cfg }}
      - name: Build
        run: cmake --build build --parallel
      - name: Kernel backends
        run: ./build/dustppd info
      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4
      - name: Reference case
        run: ./build/dustppd run configs/reference/paper_1m_100au.toml -o ref.csv -s ref.json
      - name: Install
        run: cmake --install build --prefix ${{ runner.temp }}/dpd-install

  python:
    name: python-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and install wheel
        run: python -m pip install ".[test]"
      - name: Test installed package (outside the source tree)
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python -c "import dustppd; print(dustppd.__file__, dustppd.available_backends())"
          python -m pytest "$GITHUB_WORKSPACE/tests/python" -q -k "not gui"

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: clang-format check (advisory)
        continue-on-error: true
        run: |
          sudo apt-get install -y clang-format
          clang-format --dry-run --Werror $(git ls-files '*.cpp' '*.hpp')
